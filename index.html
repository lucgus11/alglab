<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlgLab" />
    <meta
      name="description"
      content="Apprends et révise les 57 OLL et 21 PLL du Rubik's Cube. PWA hors-ligne, chrono, répétition espacée, smart cube Bluetooth."
    />
    <title>AlgLab — OLL & PLL Trainer</title>
    <script>
      // Applique le thème avant le premier rendu (évite le flash blanc).
      try {
        var s = JSON.parse(localStorage.getItem("alglab:v1") || "{}");
        var t = (s.state && s.state.settings && s.state.settings.theme) || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
